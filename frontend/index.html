<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZaminTahlil</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.14.2/dist/leaflet-geoman.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/map.css">
  <link rel="stylesheet" href="css/panels.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="tb-group">
        <span class="brand" data-i18n="app.brand"></span>
        <button id="btn-draw-rect" data-i18n-title="topbar.draw_rect_title"><span class="ico">▭</span><span data-i18n="topbar.draw_rect"></span></button>
        <button id="btn-draw-poly" data-i18n-title="topbar.draw_poly_title"><span class="ico">⬠</span><span data-i18n="topbar.draw_poly"></span></button>
        <button id="btn-clear" data-i18n-title="topbar.clear_title"><span class="ico">✕</span><span data-i18n="topbar.clear"></span></button>
      </div>
      <div class="tb-group tb-center">
        <span class="muted" data-i18n="topbar.area"></span>
        <span id="area-badge" class="badge">0.00 km²</span>
        <span id="state-badge" class="badge state"></span>
      </div>
      <div class="tb-group">
        <button id="btn-recon" class="btn-primary" disabled><span data-i18n="topbar.recon"></span></button>
        <button id="btn-stop" class="btn-danger" disabled><span data-i18n="topbar.stop"></span></button>
        <button id="btn-settings"><span class="ico">⚙</span><span data-i18n="topbar.settings"></span></button>
      </div>
    </header>

    <main id="workspace">
      <div id="map"></div>
      <aside id="panel">
        <nav class="tabs">
          <button class="tab active" data-tab="layers" data-i18n="tabs.layers"></button>
          <button class="tab" data-tab="info" data-i18n="tabs.info"></button>
          <button class="tab" data-tab="weather" data-i18n="tabs.weather"></button>
          <button class="tab" data-tab="satellites" data-i18n="tabs.satellites"></button>
          <button class="tab" data-tab="report" data-i18n="tabs.report"></button>
          <button class="tab" data-tab="usage" data-i18n="tabs.usage"></button>
        </nav>
        <section class="tab-pane active" id="pane-layers">
          <div id="composer" class="composer"></div>
          <div class="paged" id="layers-pages"></div>
        </section>
        <section class="tab-pane" id="pane-info"><div class="paged" id="info-pages"></div></section>
        <section class="tab-pane" id="pane-weather"><div class="paged" id="weather-pages"></div></section>
        <section class="tab-pane" id="pane-satellites"><div class="paged" id="satellites-pages"></div></section>
        <section class="tab-pane" id="pane-report">
          <div class="report-actions">
            <button id="btn-report-gen" class="btn-primary" disabled data-i18n="report.generate"></button>
            <button id="btn-report-dl" disabled data-i18n="report.download"></button>
          </div>
          <div id="report-meta" class="muted small"></div>
          <div class="paged md" id="report-pages"></div>
        </section>
        <section class="tab-pane" id="pane-usage"><div class="paged md" id="usage-pages"></div></section>
      </aside>
    </main>

    <footer id="bottombar">
      <div class="progress">
        <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
        <span id="progress-text" class="progress-text" data-i18n="bottom.progress_idle"></span>
      </div>
      <div class="slider" data-i18n-title="bottom.date_hint">
        <span class="muted small" data-i18n="bottom.date"></span>
        <input type="range" id="date-slider" min="0" max="0" value="0" disabled>
        <span id="date-label" class="badge" data-i18n="bottom.no_dates"></span>
      </div>
    </footer>
  </div>

  <div id="settings-modal" class="modal" hidden>
    <div class="modal-box">
      <div class="modal-head">
        <h3 data-i18n="settings.title"></h3>
        <button id="btn-settings-close" class="icon-btn" data-i18n-title="common.close">✕</button>
      </div>
      <form id="settings-form" class="settings-grid"></form>
      <div id="settings-conn" class="conn"></div>
      <div class="modal-foot">
        <button id="btn-settings-cancel" data-i18n="settings.cancel"></button>
        <button id="btn-settings-save" class="btn-primary" data-i18n="settings.save"></button>
      </div>
    </div>
  </div>

  <div id="toasts"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.14.2/dist/leaflet-geoman.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
